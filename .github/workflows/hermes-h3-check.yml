name: Hermes H1-H6 QA09-QA11 checks

on:
  push:
    branches:
      - feature/hermes-agent
    paths:
      - "src/brain/**"
      - "src/web/**"
      - "src/cart.ts"
      - "src/catalog.ts"
      - "src/orders.ts"
      - "tests/unit/brain-*.test.ts"
      - ".github/workflows/hermes-h3-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build storefront
        run: npm run build
      - name: H1-H6 and QA09-QA11 unit regression
        run: >
          node --test
          tests/unit/brain-hermes-loop.test.ts
          tests/unit/brain-hermes-h3.test.ts
          tests/unit/brain-hermes-h4.test.ts
          tests/unit/brain-hermes-h5.test.ts
          tests/unit/brain-hermes-h5-flow.test.ts
          tests/unit/brain-hermes-h6.test.ts
          tests/unit/brain-hermes-h6-graph.test.ts
          tests/unit/brain-hermes-qa09.test.ts
          tests/unit/brain-hermes-qa10.test.ts
          tests/unit/brain-hermes-qa11.test.ts
          tests/unit/brain-price-band.test.ts
          tests/unit/brain-recommendation-strategies.test.ts
          tests/unit/brain-wishlist-task.test.ts
          tests/unit/brain-task-state.test.ts
          tests/unit/brain-task-multiturn.test.ts
          tests/unit/brain-dataset-state.test.ts
          tests/unit/brain-hermes-purchase.test.ts
          tests/unit/brain-v4-flow.test.ts
          tests/unit/brain-routing.test.ts
          tests/unit/brain-recommendation-followup.test.ts
          tests/unit/brain-qa-v1.test.ts
          tests/unit/brain-conversation-history.test.ts
      - name: Full unit regression (diagnostic; requires unpublished local QA snapshots)
        continue-on-error: true
        timeout-minutes: 7
        run: npm run test:unit
