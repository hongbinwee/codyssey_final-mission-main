name: Hermes H3 isolated checks

on:
  push:
    branches:
      - feature/hermes-agent
    paths:
      - "src/brain/**"
      - "src/cart.ts"
      - "src/catalog.ts"
      - "src/orders.ts"
      - "tests/unit/brain-*.test.ts"
      - ".github/workflows/hermes-h3-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build storefront
        run: npm run build
      - name: H1 H2 H3 unit regression
        run: >
          node --test
          tests/unit/brain-hermes-loop.test.ts
          tests/unit/brain-hermes-h3.test.ts
          tests/unit/brain-wishlist-task.test.ts
          tests/unit/brain-task-state.test.ts
          tests/unit/brain-task-multiturn.test.ts
          tests/unit/brain-dataset-state.test.ts
